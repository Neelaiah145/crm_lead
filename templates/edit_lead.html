<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>edit lead</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4>Edit Lead Contact</h4>
                </div>
                <div class="card-body">
                    <form method="POST" action=""> {% csrf_token %} <!-- Name -->
                        <div class="mb-3"> <label class="form-label">Name</label> <input type="text" name="name"
                                class="form-control" value="{{ contact.name }}" required> </div> <!-- Email -->
                        <div class="mb-3"> <label class="form-label">Email</label> <input type="email" name="email"
                                class="form-control" value="{{ contact.email }}"> </div> <!-- Phone -->
                        <div class="mb-3"> <label class="form-label">Phone</label> <input type="text" name="phone"
                                class="form-control" value="{{ contact.phone_number }}"> </div> <!-- Company -->

                        <div class="mb-3"> <label class="form-label">Lead Status</label>
                             <select name="status"
                                class="form-select">
                                <option value="new" {% if contact.status == "new" %}selected{% endif %}>New</option>
                                <option value="In_Progress" {% if contact.status == "in_progress" %}selected{% endif %}>
                                    Contacted</option>
                                <option value="interest" {% if contact.status == "interest" %}selected{% endif %}>
                                    Interested</option>
                                <option value="closed" {% if contact.status == "closed" %}selected{% endif %}>Closed</option>
                            </select> </div> <!-- Notes -->
                        <div class="mb-3"> <label class="form-label">Meaasge</label> <textarea name="message"
                                class="form-control" rows="3">{{ contact.message }}</textarea> </div> <!-- Buttons -->

                        <div class="d-flex justify-content-between"> <a href="/"
                                class="btn btn-secondary">Cancel</a> <button type="submit"
                                class="btn btn-success">Update Lead</button> </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
